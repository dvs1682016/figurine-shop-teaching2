<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>咚咚造物局｜V1.15.4</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: #fff8ee; color: #29223d; font: 18px/1.6 system-ui, sans-serif; }
    main { width: min(100% - 2rem, 68rem); margin: 2rem auto; }
    h1 { font-size: clamp(1.8rem, 5vw, 3rem); margin: 0; }
    header p { margin: 0 0 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 1rem; }
    article { background: #fff; border: 1px solid #eadfd4; border-radius: 1rem; overflow: hidden; }
    figure { margin: 0; aspect-ratio: 4 / 3; background: #eee7f7; display: grid; place-items: center; }
    figure img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
    .details { padding: 1rem; }
    h2, .details p { margin: 0 0 .3rem; }
    .price { font-size: 1.35rem; font-weight: 750; color: #592d8a; }
    button, input { font: inherit; padding: .45rem .7rem; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    dialog { width: min(92%, 30rem); max-height: 90vh; border: 1px solid #eadfd4; border-radius: 1rem; padding: 1.25rem; }
    dialog::backdrop { background: #29223d99; }
    form label { display: grid; gap: .2rem; margin: .5rem 0; }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
    #review-details { overflow-wrap: anywhere; }
    #review-details p { margin: .35rem 0; }
    #review-details p:last-child { font-weight: 750; }
    #receipt label { margin: .75rem 0; }
    #receipt-order-id { width: 100%; font-family: ui-monospace, monospace; font-size: 1rem; padding: .45rem .7rem; resize: none; overflow-wrap: anywhere; }
    #receipt-breakdown strong { font-size: 1.2rem; }
    #copy-message { min-height: 1.6em; }
    #line-orders article { padding: 1rem; margin-bottom: .75rem; overflow-wrap: anywhere; }
    .remittance-form { margin-top: .75rem; padding: .75rem; background: #f4edf8; border-radius: .6rem; }
    .remittance-form label { display: grid; gap: .25rem; margin: .6rem 0; }
    .remittance-form input { min-width: 0; width: 100%; }
    .batch-remittance-label { color: #b42318; font-weight: 700; }
    .batch-order-list { padding-left: 1.3rem; }
    .batch-order-list li { margin: .35rem 0; }
    .price-breakdown { margin: .65rem 0; }
    .price-breakdown strong { display: block; margin-top: .4rem; }
    .batch-choice { display: flex; align-items: center; gap: .55rem; min-height: 2.75rem; }
    .batch-choice input { width: 1.2rem; height: 1.2rem; flex: none; }
    .batch-choice.is-included { color: #592d8a; font-weight: 700; }
    #line-orders article p { margin: .35rem 0; }
    footer { margin-top: 2rem; font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>咚咚造物局</h1>
      <p>教學演練，請使用課堂測試資料，勿實際匯款。</p>
      <p>手作公仔 · 現貨商品</p>
      <p><a href="./payment.html">付款與配送</a></p>
    </header>
    <p id="line-status" role="status">正在確認 LINE 帳號…</p>
    <nav class="actions" aria-label="LINE 購物功能">
      <button id="show-shop" type="button" hidden>返回購物</button>
      <button id="show-orders" type="button" hidden>我的訂單</button>
      <button id="line-login" type="button" hidden>使用 LINE 登入</button>
    </nav>
    <section id="line-orders" aria-label="我的訂單" hidden>
      <h2>我的訂單</h2>
      <p>顯示這個 LINE 帳號最近 50 筆已綁定的訂單。</p>
      <p id="line-orders-message" role="status"></p>
      <div id="batch-payment"></div>
      <div id="line-order-list"></div>
      <p><a href="./order.html">用編號查詢舊訂單</a></p>
    </section>
    <p id="status" role="status"></p>
    <section id="products" class="grid" aria-label="商品清單"></section>
    <dialog id="checkout" aria-labelledby="checkout-title">
      <h2 id="checkout-title" tabindex="-1">填寫訂單</h2>
      <form id="order-form">
        <p id="selected-product"></p>
        <label>數量<input name="quantity" type="number" min="1" max="99" step="1" required></label>
        <label>收件人<input name="customer" maxlength="60" autocomplete="shipping name" required></label>
        <label>手機（09 開頭，共 10 碼）<input name="phone" type="tel" inputmode="numeric" pattern="09[0-9]{8}" maxlength="10" autocomplete="shipping tel" required></label>
        <label>收件地址<input name="address" maxlength="200" autocomplete="shipping street-address" required></label>
        <p id="estimate"></p>
        <div class="actions">
          <button type="submit">下一步：確認訂單</button>
          <button id="close-checkout" type="button">返回商品頁</button>
        </div>
      </form>
      <section id="order-review" hidden>
        <p>請核對以下資料，再確認送出。付款方式為銀行轉帳，請在「我的訂單」查看匯款資訊。</p>
        <div id="review-details"></div>
        <div class="actions">
          <button id="edit-order" type="button">返回修改</button>
          <button id="submit-order" type="button">確認送出訂單</button>
        </div>
      </section>
      <section id="receipt" hidden>
        <p>請先儲存訂單編號，查詢訂單時會用到。</p>
        <label>訂單編號
          <textarea id="receipt-order-id" rows="2" readonly spellcheck="false"></textarea>
        </label>
        <div id="receipt-breakdown"></div>
        <p>到「我的訂單」查看匯款資訊並模擬回報。訂單編號可留作查詢備用。</p>
        <p><button id="receipt-orders" type="button">查看我的訂單</button></p>
        <div class="actions">
          <button id="copy-order-id" type="button">複製訂單編號</button>
          <button id="close-receipt" type="button">返回商品頁</button>
        </div>
        <p id="copy-message" role="status"></p>
      </section>
      <p id="checkout-message" role="status"></p>
    </dialog>
    <footer>LINE 公仔銷售平台 V1.15.4 · 公仔商店</footer>
  </main>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // LINE 公仔銷售平台 V1.15.4
    const LIFF_ID = 'YOUR_LIFF_ID';
    const lineStatus = document.querySelector('#line-status');
    const loginButton = document.querySelector('#line-login');
    const shopButton = document.querySelector('#show-shop');
    const ordersButton = document.querySelector('#show-orders');
    const ordersPanel = document.querySelector('#line-orders');
    const batchPayment = document.querySelector('#batch-payment');
    const orderList = document.querySelector('#line-order-list');
    const ordersMessage = document.querySelector('#line-orders-message');
    const lineOrderStatuses = new Map([
      ['pending_payment', '待付款'], ['paid', '已付款'],
      ['shipped', '已出貨'], ['cancelled', '已取消']
    ]);
    let lineToken = '';
    const SUPABASE_URL = 'https://YOUR_PROJECT_REF.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'YOUR_SUPABASE_PUBLISHABLE_KEY';
    const IMAGE_BASE = SUPABASE_URL + '/storage/v1/object/public/product-images/';
    const status = document.querySelector('#status');
    const products = document.querySelector('#products');
    const checkout = document.querySelector('#checkout');
    const orderForm = document.querySelector('#order-form');
    const checkoutTitle = document.querySelector('#checkout-title');
    const orderReview = document.querySelector('#order-review');
    const reviewDetails = document.querySelector('#review-details');
    const editOrder = document.querySelector('#edit-order');
    const quantityInput = orderForm.elements.namedItem('quantity');
    const checkoutMessage = document.querySelector('#checkout-message');
    const submitOrder = document.querySelector('#submit-order');
    const closeCheckout = document.querySelector('#close-checkout');
    const receipt = document.querySelector('#receipt');
    const receiptOrderId = document.querySelector('#receipt-order-id');
    const receiptBreakdown = document.querySelector('#receipt-breakdown');
    const copyMessage = document.querySelector('#copy-message');
    const shippingFee = 60;
    let selectedProduct;
    let reviewedOrder;
    let pendingOrder;
    let submitting = false;
    const currency = new Intl.NumberFormat('zh-TW', {
      style: 'currency', currency: 'TWD', maximumFractionDigits: 0
    });

    function addText(parent, tag, value, className = '') {
      const element = document.createElement(tag);
      element.className = className;
      element.textContent = value;
      parent.append(element);
      return element;
    }

    function makeCard(product) {
      const card = document.createElement('article');
      const photo = document.createElement('figure');
      const image = document.createElement('img');
      image.alt = product.name;
      image.src = IMAGE_BASE + encodeURIComponent(product.image_filename);
      image.addEventListener('error', () => {
        photo.replaceChildren();
        addText(photo, 'span', '照片暫時無法顯示');
      }, { once: true });
      photo.append(image);
      const details = document.createElement('div');
      details.className = 'details';
      addText(details, 'h2', product.name);
      addText(details, 'p', currency.format(product.price_ntd), 'price');
      addText(details, 'p', product.stock > 0 ? '現貨 ' + product.stock + ' 件' : '已售完');
      const buy = document.createElement('button');
      buy.type = 'button';
      buy.textContent = product.stock > 0 ? '購買這款' : '已售完';
      buy.disabled = product.stock <= 0;
      buy.addEventListener('click', () => openCheckout(product));
      details.append(buy);
      card.append(photo, details);
      return card;
    }

    async function loadProducts() {
      if (!SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_')) {
        status.textContent = '請先在 index.html 填入本專案的 Supabase Publishable key。';
        return;
      }

      status.textContent = '正在讀取商品…';
      const url = new URL('/rest/v1/products', SUPABASE_URL);
      url.searchParams.set('select', 'sku,name,price_ntd,stock,image_filename');
      url.searchParams.set('order', 'sku.asc');

      try {
        const response = await fetch(url, { headers: { apikey: SUPABASE_PUBLISHABLE_KEY } });
        if (!response.ok) {
          status.textContent = '商品讀取失敗（HTTP ' + response.status + '）。請確認金鑰與第三課 SQL。';
          return;
        }
        const catalog = await response.json();
        products.replaceChildren(...catalog.map(makeCard));
        status.textContent = catalog.length ? '' : '目前沒有上架商品。';
      } catch {
        status.textContent = '商品讀取失敗。請確認網路連線後重新整理。';
      }
    }

    function updateEstimate() {
      document.querySelector('#estimate').textContent = quantityInput.validity.valid
        ? '含運費 ' + currency.format(shippingFee) + '，合計 ' +
          currency.format(selectedProduct.price_ntd * quantityInput.valueAsNumber + shippingFee)
        : '請輸入可購買的數量。';
    }

    function showEditStep() {
      reviewedOrder = null;
      reviewDetails.replaceChildren();
      orderReview.hidden = true;
      orderForm.hidden = false;
      checkoutTitle.textContent = '填寫訂單';
      checkoutMessage.textContent = '';
    }

    function reviewOrder(event) {
      event.preventDefault();
      if (orderForm.hidden || pendingOrder) return;
      const fields = new FormData(orderForm);
      reviewedOrder = {
        p_sku: selectedProduct.sku,
        p_quantity: Number(fields.get('quantity')),
        p_expected_price_ntd: selectedProduct.price_ntd,
        p_name: fields.get('customer').trim(),
        p_phone: fields.get('phone').trim(),
        p_address: fields.get('address').trim()
      };
      const subtotal = reviewedOrder.p_expected_price_ntd * reviewedOrder.p_quantity;
      reviewDetails.replaceChildren();
      addText(reviewDetails, 'p', '商品：' + selectedProduct.name);
      addText(reviewDetails, 'p', '單價：' + currency.format(reviewedOrder.p_expected_price_ntd));
      addText(reviewDetails, 'p', '數量：' + reviewedOrder.p_quantity);
      addText(reviewDetails, 'p', '收件人：' + reviewedOrder.p_name);
      addText(reviewDetails, 'p', '手機：' + reviewedOrder.p_phone);
      addText(reviewDetails, 'p', '收件地址：' + reviewedOrder.p_address);
      addText(reviewDetails, 'p', '商品小計：' + currency.format(subtotal));
      addText(reviewDetails, 'p', '運費：' + currency.format(shippingFee));
      addText(reviewDetails, 'p', '應付金額：' + currency.format(subtotal + shippingFee));
      orderForm.hidden = true;
      orderReview.hidden = false;
      checkoutTitle.textContent = '確認訂單';
      checkoutMessage.textContent = '';
      checkoutTitle.focus();
    }

    function openCheckout(product) {
      selectedProduct = product;
      orderForm.reset();
      showEditStep();
      quantityInput.max = Math.min(product.stock, 99);
      quantityInput.value = 1;
      document.querySelector('#selected-product').textContent =
        product.name + ' · 單價 ' + currency.format(product.price_ntd);
      checkoutMessage.textContent = '';
      receipt.hidden = true;
      receiptOrderId.value = '';
      copyMessage.textContent = '';
      updateEstimate();
      checkout.showModal();
    }

    async function sendOrder() {
      if (submitting || orderReview.hidden || !reviewedOrder || !lineToken) return;
      if (!pendingOrder) {
        if (typeof crypto.randomUUID !== 'function') {
          checkoutMessage.textContent = '請用 Chrome 開啟本機檔案，或使用 HTTPS 網址。';
          return;
        }
        pendingOrder = { p_request_id: crypto.randomUUID(), ...reviewedOrder };
      }

      submitting = true;
      editOrder.disabled = true;
      submitOrder.disabled = true;
      checkoutMessage.textContent = '正在送出訂單…';
      try {
        const response = await lineOrderRequest({ action: 'place', order: pendingOrder });
        if (response.status === 401) {
          checkoutMessage.textContent = 'LINE 登入已失效。重新開啟購物頁後，請先到「我的訂單」確認是否已成立。';
          return;
        }
        const result = await response.json();
        if (!response.ok) {
          const messages = {
            INVALID_ORDER: '請檢查收件資料與數量。',
            STOCK_UNAVAILABLE: '庫存已變動，請返回商品頁重新選購。',
            PRICE_CHANGED: '價格已變動，請返回商品頁重新確認。',
            REQUEST_CONFLICT: '訂單編號發生衝突，請重新選購。'
          };
          if (!Object.hasOwn(messages, result.message)) throw new Error('unknown result');
          pendingOrder = null;
          checkoutMessage.textContent = messages[result.message];
          if (['STOCK_UNAVAILABLE', 'PRICE_CHANGED'].includes(result.message)) loadProducts();
          return;
        }
        if (result.line_linked !== true || result.order_id !== pendingOrder.p_request_id || !Number.isSafeInteger(result.total_ntd)) {
          throw new Error('unknown result');
        }
        const purchased = {
          name: selectedProduct.name,
          quantity: pendingOrder.p_quantity,
          unit_price_ntd: pendingOrder.p_expected_price_ntd
        };
        pendingOrder = null;
        showReceipt(result, purchased);
        loadProducts();
      } catch {
        checkoutMessage.textContent = '目前無法確認訂單結果。請檢查網路與第四課 SQL，再按「重試同一筆」。';
      } finally {
        submitting = false;
        submitOrder.disabled = false;
        submitOrder.textContent = pendingOrder ? '重試同一筆' : '確認送出訂單';
        editOrder.disabled = Boolean(pendingOrder);
      }
    }

    quantityInput.addEventListener('input', updateEstimate);
    closeCheckout.addEventListener('click', () => checkout.close());
    function showReceipt(order, purchased) {
      reviewedOrder = null;
      reviewDetails.replaceChildren();
      orderReview.hidden = true;
      orderForm.hidden = true;
      checkoutMessage.textContent = '';
      receiptOrderId.value = order.order_id;
      const subtotal = purchased.unit_price_ntd * purchased.quantity;
      receiptBreakdown.replaceChildren();
      addPriceBreakdown(receiptBreakdown, [purchased], order.total_ntd - subtotal, order.total_ntd);
      checkoutTitle.textContent = '訂單已成立，已綁定 LINE';
      receipt.hidden = false;
      checkout.scrollTop = 0;
      checkoutTitle.focus();
    }

    async function copyOrderId() {
      try {
        await navigator.clipboard.writeText(receiptOrderId.value);
        copyMessage.textContent = '已複製訂單編號。';
      } catch {
        receiptOrderId.focus();
        receiptOrderId.select();
        receiptOrderId.setSelectionRange(0, receiptOrderId.value.length);
        copyMessage.textContent = '已選取訂單編號，請使用手機的「拷貝」功能。';
      }
    }

    function returnToEdit() {
      if (pendingOrder) return;
      showEditStep();
      checkoutTitle.focus();
    }

    checkout.addEventListener('cancel', (event) => {
      if (!orderReview.hidden) {
        event.preventDefault();
        returnToEdit();
      }
    });
    editOrder.addEventListener('click', returnToEdit);
    orderForm.addEventListener('submit', reviewOrder);
    submitOrder.addEventListener('click', sendOrder);
    document.querySelector('#copy-order-id').addEventListener('click', copyOrderId);
    document.querySelector('#close-receipt').addEventListener('click', () => checkout.close());
    function lineOrderRequest(payload) {
      return fetch('/api/line-orders', {
        method: 'POST',
        cache: 'no-store',
        headers: { Authorization: 'Bearer ' + lineToken, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: AbortSignal.timeout(16000)
      });
    }

    function showShop() {
      ordersPanel.hidden = true;
      shopButton.hidden = true;
      products.hidden = false;
      status.hidden = false;
    }

    const combinedShippingFee = 60;

    function addPriceBreakdown(panel, items, shipping, total) {
      const box = document.createElement('div');
      box.className = 'price-breakdown';
      const list = document.createElement('ul');
      list.className = 'batch-order-list';
      for (const item of items) {
        const unit = currency.format(item.unit_price_ntd);
        const amount = currency.format(item.unit_price_ntd * item.quantity);
        const row = addText(list, 'li', '');
        addText(row, 'div', item.name);
        addText(row, 'div', '單價 ' + unit + ' × 數量 ' + item.quantity + ' ＝ ' + amount);
      }
      box.append(list);
      if (Number.isSafeInteger(shipping)) addText(box, 'p', '運費：' + currency.format(shipping));
      addText(box, 'strong', '應付金額：' + currency.format(total));
      panel.append(box);
    }

    function addCombinedBreakdown(panel, selected, total) {
      addText(panel, 'h3', '合併出貨費用明細');
      addPriceBreakdown(panel, selected.flatMap(order => order.items), combinedShippingFee, total);
    }

    function addRemittanceForm(card, order) {
      const batch = Array.isArray(order.order_ids);
      let batchId;
      const open = document.createElement('button');
      open.type = 'button';
      open.textContent = batch ? '查看合併匯款資訊／回報匯款' : '查看匯款資訊／回報匯款';
      const panel = document.createElement('div');
      panel.className = 'remittance-form';
      panel.hidden = true;
      card.append(open, panel);
      open.addEventListener('click', async () => {
        if (open.disabled) return;
        open.disabled = true;
        panel.hidden = false;
        panel.textContent = '正在讀取匯款資訊…';
        try {
          const response = await lineOrderRequest({ action: 'bank' });
          if (!response.ok) throw new Error('bank unavailable');
          const bank = await response.json();
          panel.replaceChildren();
          if (!bank) {
            panel.textContent = '店家尚未設定匯款帳號。';
            return;
          }
          addText(panel, 'p', bank.bank_name + '（' + bank.bank_code + '）');
          addText(panel, 'p', '戶名：' + bank.account_name);
          addText(panel, 'p', '帳號：' + bank.account_number);
          addText(panel, 'p', '本頁為測試，請勿實際轉帳。');
          const form = document.createElement('form');
          const last5 = document.createElement('input');
          last5.type = 'text';
          last5.inputMode = 'numeric';
          last5.pattern = '[0-9]{5}';
          last5.maxLength = 5;
          last5.required = true;
          addText(form, 'label', '付款帳號末五碼').append(last5);
          const time = document.createElement('input');
          time.type = 'datetime-local';
          time.required = true;
          addText(form, 'label', '匯款時間（台灣時間）').append(time);
          const submit = document.createElement('button');
          submit.type = 'submit';
          submit.textContent = '回報匯款';
          form.append(submit);
          const note = addText(form, 'p', '');
          note.setAttribute('role', 'status');
          panel.append(form);
          open.hidden = true;
          form.addEventListener('submit', async event => {
            event.preventDefault();
            if (submit.disabled) return;
            const at = new Date(time.value + '+08:00');
            if (!Number.isFinite(at.getTime())) {
              note.textContent = '請填寫正確的匯款時間。';
              return;
            }
            submit.disabled = true;
            note.textContent = '正在回報…';
            try {
              if (batch && !batchId) batchId = crypto.randomUUID();
              const report = { id: batch ? batchId : order.id, last5: last5.value, at: at.toISOString() };
              if (batch) {
                report.order_ids = order.order_ids;
                report.total_ntd = order.total_ntd;
              }
              const response = await lineOrderRequest({ action: batch ? 'batch' : 'report', report });
              const result = await response.json();
              if (response.ok && result.reported === true) {
                await showOrders();
                return;
              }
              const messages = {
                INVALID_REMITTANCE: '請核對末五碼與匯款時間。',
                INVALID_BATCH: '請核對合併訂單、末五碼與匯款時間。',
                BATCH_CONFLICT: '這筆合併回報已變更，請重新讀取訂單。',
                DELIVERY_MISMATCH: '這些訂單的收件資料不同，請分開付款。',
                TOTAL_CHANGED: '訂單金額已變更，請重新查詢後與店主核對。',
                ORDER_NOT_PAYABLE: '這筆訂單已不能回報，請重新整理訂單。',
                ALREADY_REPORTED: '這筆訂單已有回報，請重新整理訂單。',
                BANK_NOT_CONFIGURED: '店家尚未設定匯款帳號。'
              };
              note.textContent = messages[result.message] || '回報未確認，請重試相同資料或重新查看訂單。';
            } catch {
              note.textContent = '回報未確認，請重試相同資料或重新查看訂單。';
            } finally {
              submit.disabled = false;
            }
          });
        } catch {
          panel.textContent = '目前無法讀取匯款資訊，請稍後再試。';
        } finally {
          open.disabled = false;
        }
      });
    }

    function renderBatch(batchOrders) {
      const order = batchOrders[0];
      const card = document.createElement('article');
      const ids = order.batch_order_ids || batchOrders.map(item => item.id);
      const states = order.batch_order_statuses || Object.fromEntries(batchOrders.map(item => [item.id, item.status]));
      const uniqueStates = new Set(Object.values(states));
      const commonState = uniqueStates.size === 1 ? Object.values(states)[0] : null;
      const label = commonState === 'pending_payment' ? '待核對匯款' : lineOrderStatuses.get(commonState);
      const title = addText(card, 'h3', label || '');
      addText(title, 'span', label ? ' - 合併匯款' : '合併匯款', 'batch-remittance-label');

      const items = order.batch_item_lines || batchOrders.flatMap(item => item.items);
      addPriceBreakdown(card, items, order.batch_shipping_fee_ntd, order.batch_total_ntd);

      const details = document.createElement('details');
      addText(details, 'summary', '查看訂單編號');
      for (const id of ids) {
        const statusLabel = lineOrderStatuses.get(states[id]);
        addText(details, 'p', id + (!label && statusLabel ? ' · ' + statusLabel : ''));
      }
      card.append(details);
      return card;
    }

    async function showOrders() {
      if (!lineToken || ordersButton.disabled) return;
      ordersPanel.hidden = false;
      shopButton.hidden = false;
      products.hidden = true;
      status.hidden = true;
      ordersButton.disabled = true;
      orderList.replaceChildren();
      batchPayment.replaceChildren();
      ordersMessage.textContent = '正在讀取訂單…';
      try {
        const response = await lineOrderRequest({ action: 'list' });
        if (response.status === 401) {
          ordersMessage.textContent = 'LINE 登入已失效，請重新開啟頁面。';
          return;
        }
        if (!response.ok) throw new Error('orders unavailable');
        const rows = await response.json();
        const batches = new Map();
        for (const order of rows) {
          if (!order.batch_id) continue;
          if (!batches.has(order.batch_id)) batches.set(order.batch_id, []);
          batches.get(order.batch_id).push(order);
        }
        const renderedBatches = new Set();
        const selected = new Map();
        const updateCardViews = new Map();
        const eligible = rows.filter(order => order.status === 'pending_payment' && !order.remittance_reported);
        if (eligible.length >= 2) {
          addText(batchPayment, 'h3', '合併付款');
          addText(batchPayment, 'p', '請從下方勾選至少兩筆待付款訂單。');
        }
        const summary = addText(batchPayment, 'p', '');
        const batchForm = document.createElement('div');
        batchPayment.append(batchForm);
        for (const order of rows) {
          if (batches.has(order.batch_id)) {
            if (!renderedBatches.has(order.batch_id)) {
              orderList.append(renderBatch(batches.get(order.batch_id)));
              renderedBatches.add(order.batch_id);
            }
            continue;
          }
          const card = document.createElement('article');
          const pending = order.status === 'pending_payment';
          const label = pending && order.remittance_reported ? '待核對匯款' :
            (lineOrderStatuses.get(order.status) || '處理中');
          addText(card, 'h3', label);
          const details = document.createElement('div');
          card.append(details);
          const shipping = order.shipping_fee_ntd ?? (order.total_ntd - order.subtotal_ntd);
          addPriceBreakdown(details, order.items, shipping, order.total_ntd);
          addText(details, 'p', '訂單編號：' + order.id);
          if (pending && !order.remittance_reported) {
            addRemittanceForm(details, order);
            if (eligible.length >= 2) {
              const label = document.createElement('label');
              label.className = 'batch-choice';
              const checkbox = document.createElement('input');
              checkbox.type = 'checkbox';
              const choiceText = document.createElement('span');
              const names = order.items.map(item => item.name).join('、');
              choiceText.textContent = '加入合併付款';
              checkbox.setAttribute('aria-label', '加入合併付款：' + names + '，訂單編號 ' + order.id);
              label.append(checkbox, choiceText);
              card.append(label);
              updateCardViews.set(order.id, included => {
                details.hidden = included;
                label.classList.toggle('is-included', included);
                choiceText.textContent = included ? names + '｜已納入上方合併明細' : '加入合併付款';
              });
              checkbox.addEventListener('change', () => {
                if (checkbox.checked) selected.set(order.id, order);
                else selected.delete(order.id);
                const chosen = [...selected.values()];
                summary.textContent = chosen.length ? '已選 ' + chosen.length + ' 筆訂單' : '';
                batchForm.replaceChildren();
                for (const update of updateCardViews.values()) update(false);
                if (chosen.length < 2) return;
                if (chosen.some(item => item.delivery_group !== chosen[0].delivery_group)) {
                  addText(batchForm, 'p', '收件人、手機或地址不同，請選擇收件資料相同的訂單。');
                  return;
                }
                if (chosen.some(item => !Number.isSafeInteger(item.subtotal_ntd))) {
                  addText(batchForm, 'p', '無法核算商品金額，請重新載入訂單。');
                  return;
                }
                const subtotal = chosen.reduce((sum, item) => sum + item.subtotal_ntd, 0);
                const total = subtotal + combinedShippingFee;
                for (const item of chosen) updateCardViews.get(item.id)(true);
                addCombinedBreakdown(batchForm, chosen, total);
                addRemittanceForm(batchForm, { order_ids: chosen.map(item => item.id), total_ntd: total });
              });
            }
          }
          orderList.append(card);
        }
        ordersMessage.textContent = rows.length ? '' : '這個 LINE 帳號還沒有綁定的訂單。';
      } catch {
        ordersMessage.textContent = '目前無法讀取訂單，請稍後再試。';
      } finally {
        ordersButton.disabled = false;
      }
    }

    async function startLineShop() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          lineStatus.textContent = '請先用 LINE 登入，再購買或查詢訂單。';
          loginButton.hidden = false;
          return;
        }
        lineToken = liff.getIDToken();
        if (!lineToken) throw new Error('ID token unavailable');
        lineStatus.textContent = '已用 LINE 登入。';
        ordersButton.hidden = false;
        loadProducts();
        if (new URLSearchParams(location.search).get('view') === 'orders') showOrders();
      } catch {
        lineStatus.textContent = 'LINE 登入未完成。請從 LIFF 測試連結開啟，並確認帳號有測試權限。';
      }
    }

    loginButton.addEventListener('click', () => liff.login());
    document.querySelector('#receipt-orders').addEventListener('click', () => {
      checkout.close();
      showOrders();
    });
    shopButton.addEventListener('click', showShop);
    ordersButton.addEventListener('click', showOrders);
    startLineShop();
  </script>
</body>
</html>
