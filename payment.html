<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>付款與配送｜咚咚造物局 V1.10.1</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff8ee; color: #29223d; font: 18px/1.6 system-ui, sans-serif; }
    main { width: min(100% - 2rem, 38rem); margin: 2rem auto; }
    .brand { margin: 0; color: #592d8a; }
    h1 { margin: .2rem 0 1rem; font-size: clamp(1.9rem, 7vw, 2.6rem); }
    h2 { margin: 0 0 .4rem; font-size: 1.3rem; }
    section { background: white; border: 1px solid #e5d8cb; border-radius: 1rem; padding: 1rem; margin: 1rem 0; }
    section p { margin: .35rem 0; }
    .notice { background: #f3eaf9; color: #43245f; border-radius: .7rem; padding: .75rem 1rem; }
    nav { display: flex; flex-wrap: wrap; gap: .75rem; }
    nav a { padding: .55rem .85rem; border: 1px solid #592d8a; border-radius: .45rem; color: #592d8a; text-decoration: none; }
    nav a:first-child { background: #592d8a; color: white; }
    nav a:focus-visible { outline: 3px solid #29223d; outline-offset: 3px; }
    footer { margin-top: 2rem; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">咚咚造物局</p>
      <h1>付款與配送</h1>
    </header>
    <p class="notice"><strong>目前為教學試單。</strong> 請勿匯款。確認收款與出貨都是流程演練。</p>
    <section aria-labelledby="payment-title">
      <h2 id="payment-title">付款方式</h2>
      <p>在 LINE「我的訂單」開啟待付款訂單，查看匯款資訊並模擬回報末五碼與時間。</p>
    </section>
    <section aria-labelledby="delivery-title">
      <h2 id="delivery-title">配送與運費</h2>
      <p>單筆運費 <strong>NT$60</strong>。相同收件資料的多筆待付款訂單，可合併匯款與出貨，整批只計一次運費。</p>
      <p>送出前請核對收件人、手機和地址。正式配送方式與出貨時間會在開賣前公布。</p>
    </section>
    <section aria-labelledby="status-title">
      <h2 id="status-title">如何查看進度</h2>
      <p>以原下單 LINE 帳號開啟「我的訂單」，即可查看進度。</p>
      <p>一般流程為「待付款 → 待核對匯款 → 已付款 → 已出貨」。</p>
    </section>
    <nav aria-label="商店功能">
      <a href="https://liff.line.me/2012537369-nfXc1SHm?view=orders">我的訂單</a>
      <a href="./">返回購物頁</a>
    </nav>
    <footer>LINE 公仔銷售平台 V1.10.1 · 付款與配送</footer>
  </main>
</body>
</html>
